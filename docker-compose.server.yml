# Server deployment: Caddy (HTTPS) -> app -> Postgres. Only ports 80/443 are open.
#   docker compose -f docker-compose.server.yml up -d --build
# Needs a .env next to this file with DOMAIN, POSTPILOT_TOKEN, POSTGRES_PASSWORD (see README, "Run on a server").
name: postpilot

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: postpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: postpilot
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"   # bytewise text order (timestamps are ISO text)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postpilot -d postpilot"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTPILOT_TOKEN: ${POSTPILOT_TOKEN:?set POSTPILOT_TOKEN to a long random string}
      POSTPILOT_NO_AUTH: ${POSTPILOT_NO_AUTH:-0}   # 1 = no access key needed (trusted local network only)
      DATABASE_URL: postgresql://postpilot:${POSTGRES_PASSWORD}@db:5432/postpilot
    volumes:
      - appdata:/data          # uploaded images, secrets.json (LinkedIn token, AI key), log
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:47821/health', timeout=5)"]
      interval: 60s
      timeout: 10s
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN, e.g. postpilot.thedbadmin.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # HTTPS certificates
      - caddy_config:/config

volumes:
  pgdata:
  appdata:
  caddy_data:
  caddy_config:
